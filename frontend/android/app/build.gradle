apply plugin: 'com.android.application'

// Firma degli APK: il keystore sta fuori dal repo e lo indica
// keystore.properties (ignorato da git, modello in keystore.properties.example).
// Deve essere sempre lo stesso: Android accetta un aggiornamento solo con la
// firma dell'app installata, e il client OAuth Android di Google riconosce
// l'app dallo SHA-1 del certificato (vedi mobile/signing.ps1).
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def hasSigning = signingProps['storeFile'] != null

android {
    signingConfigs {
        if (hasSigning) {
            create('app') {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    namespace = "com.renamemusic.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.renamemusic.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versione dell'app: la passa build-apk.ps1 leggendola da
        // internal/update/update.go (update.Version). versionCode deve crescere
        // a ogni release, altrimenti Android rifiuta l'aggiornamento.
        versionCode Integer.parseInt((project.findProperty('appVersionCode') ?: '1').toString())
        versionName((project.findProperty('appVersionName') ?: '1.0').toString())
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (hasSigning) signingConfig signingConfigs.app
        }
        release {
            if (hasSigning) signingConfig signingConfigs.app
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // youtubedl-android esegue Python e ffmpeg come processi a partire
            // dalla cartella delle librerie native: devono essere estratte su
            // disco all'installazione (equivale a extractNativeLibs="true").
            useLegacyPackaging = true
        }
    }
    splits {
        abi {
            // Un APK per architettura: il core Go (gomobile) è compilato solo per
            // arm64-v8a (telefoni) e x86_64 (emulatore). Senza split l'APK
            // includerebbe anche le librerie armeabi-v7a/x86 di youtubedl-android,
            // inutilizzabili senza il core Go per quelle architetture.
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Core Go (internal/core + mobile) generato da `gomobile bind`: vedi
    // mobile/build-apk.ps1, che lo compila in app/libs prima di Gradle.
    implementation files('libs/renamemusic.aar')
    // yt-dlp su Android: Python, yt-dlp e ffmpeg incorporati nell'APK.
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroidVersion"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroidVersion"
    // Account Google per la YouTube Data API (AuthorizationClient).
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Senza keystore.properties Gradle firmerebbe con ~/.android/debug.keystore, che
// su un'altra macchina è diverso: meglio fermarsi (la sincronizzazione del
// progetto in Android Studio funziona comunque, non esegue preBuild).
tasks.named('preBuild') {
    doFirst {
        if (!hasSigning) {
            throw new GradleException("Manca frontend/android/keystore.properties (con storeFile): crealo da keystore.properties.example.")
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
